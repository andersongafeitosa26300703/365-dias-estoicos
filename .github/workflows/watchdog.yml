name: Conferir post do dia

on:
  schedule:
    # 10:00 UTC = 07:00 em Brasilia (depois das execucoes de reserva das 05:00, 05:20, 05:50 e 06:30)
    - cron: "0 10 * * *"
    # Reserva: o GitHub as vezes atrasa ou perde disparos agendados.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Conferir um dia especifico (1-365). Vazio = dia de hoje."
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DAY_ARG: ${{ github.event.inputs.day && format('--day {0}', github.event.inputs.day) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Falha (e o GitHub envia e-mail) se o feed ou o Story de hoje nao tiverem sido publicados
      - run: python scripts/check_today.py $DAY_ARG
