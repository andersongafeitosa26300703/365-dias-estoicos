name: Post diario 365 Dias Estoicos

on:
  schedule:
    # 09:30 UTC = 06:30 em Brasilia (UTC-3, sem horario de verao)
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Forcar um dia especifico (1-365). Vazio = dia de hoje."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      DAY_ARG: ${{ github.event.inputs.day && format('--day {0}', github.event.inputs.day) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar imagem e legenda
        run: python scripts/post_daily.py prepare $DAY_ARG

      - name: Enviar imagem ao repositorio (URL publica exigida pelo Instagram)
        run: |
          git config user.name "365-dias-estoicos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Imagem do dia"
          git push

      - name: Publicar no Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_daily.py publish $DAY_ARG

      - name: Registrar publicacao
        if: always()
        run: |
          git add data/posted.json
          git diff --cached --quiet || git commit -m "Registro da publicacao"
          git push
